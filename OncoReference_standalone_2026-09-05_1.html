+ consolidation immunotherapy","evidence":"PACIFIC trial","line":"NSCLC — definitive, unresectable stage III","regimen":"Concurrent chemoradiation, then durvalumab x1 year if controlled"},{"approach":"Targeted therapy by oncogenic driver","evidence":"–","line":"NSCLC — first-line, metastatic, driver-positive","regimen":"EGFR: gefitinib/erlotinib/afatinib/osimertinib/dacomitinib; ALK: crizotinib/alectinib/ceritinib/brigatinib/lorlatinib; ROS1: crizotinib/entrectinib/ceritinib/lorlatinib; NTRK: larotrectinib/entrectinib; BRAF V600E: dabrafenib+trametinib or vemurafenib"},{"approach":"Chemo-immunotherapy (PD-L1-guided)","evidence":"–","line":"NSCLC — first-line, metastatic, driver-negative","regimen":"PD-L1>=50%: pembrolizumab or atezolizumab alone. Otherwise: platinum+pemetrexed+pembrolizumab (non-squamous); carboplatin+paclitaxel+pembrolizumab (squamous); carboplatin+nab-paclitaxel+atezolizumab (non-squamous); nivolumab+ipilimumab; carboplatin+paclitaxel+atezolizumab+bevacizumab (non-squamous)"},{"approach":"Chemo +/- targeted/immunotherapy","evidence":"–","line":"NSCLC — subsequent-line, driver-negative","regimen":"Docetaxel or pemetrexed (non-squamous only); docetaxel+nintedanib or docetaxel+ramucirumab; immunotherapy (atezolizumab/nivolumab/pembrolizumab if PD-L1>1%) if not previously given"},{"approach":"Concurrent chemoradiation","evidence":"–","line":"SCLC — limited-stage, good PS","regimen":"Cisplatin + etoposide x4-6 cycles with concurrent thoracic radiotherapy"},{"approach":"Chemo-immunotherapy","evidence":"IMpower133 (atezolizumab); CASPIAN (durvalumab)","line":"SCLC — extensive-stage, first-line","regimen":"Atezolizumab + carboplatin + etoposide, or durvalumab + (cisplatin/carboplatin) + etoposide x4 cycles, then immunotherapy maintenance"},{"approach":"Second-line chemotherapy","evidence":"–","line":"SCLC — relapse <6 months, ECOG 0-2","regimen":"Topotecan, paclitaxel, docetaxel, irinotecan, temozolomide, gemcitabine, or CAV (cyclophosphamide/doxorubicin/vincristine); nivolumab +/- ipilimumab or pembrolizumab"}],"source":{"date":"2023-11","name":"Short Notes in Clinical Oncology: A Case-based Approach — NSCLC & SCLC chapters","version":"1st ed."},"stage_badges":["I","II","III","IV","LD (SCLC)","ED (SCLC)"],"staging":["Both NSCLC and SCLC are staged with the AJCC Cancer Staging Manual, 8th edition (TNM-based).","SCLC is additionally staged with the two-tier VA scheme: Limited-stage (LD) — confined to one hemithorax; Extensive-stage (ED) — disease beyond the ipsilateral hemithorax, including malignant pleural effusion or hematogenous metastasis."],"status":"ready","th":"มะเร็งปอด","toxicity_monitoring":["Bevacizumab-containing regimens are contraindicated in squamous histology, brain metastasis, hemoptysis, or a major thromboembolic event.","Pemetrexed is not used in squamous histology."],"treatment_overview":[{"heading":"NSCLC — Resectable Early-Stage","items":["Surgery ± adjuvant chemotherapy, adjuvant osimertinib x3 years if EGFR-mutant, adjuvant immunotherapy as an option, adjuvant radiotherapy for positive margins."],"tone":"accent"},{"heading":"NSCLC — Locally Advanced / Unresectable","items":["Mostly stage III: definitive chemoradiation then consolidation durvalumab x1 year if controlled."],"tone":"amber"},{"heading":"NSCLC — Advanced / Metastatic","items":["Driver-positive disease gets matched targeted therapy; driver-negative disease gets chemotherapy ± immunotherapy ± bevacizumab."],"tone":"rose"},{"heading":"SCLC — Limited-Stage","items":["Concurrent cisplatin/etoposide chemoradiation for good-performance-status stage IIB-IIIC."],"tone":"amber"},{"heading":"SCLC — Extensive-Stage","items":["Platinum-etoposide chemotherapy plus immunotherapy, continued as maintenance if response is achieved."],"tone":"rose"}]},"melanoma-skin-cancer":{"clinical_presentation":[">70% present with a change in color or size of a pre-existing skin lesion.","ABCDE criteria (Asymmetry, Border irregularity, Color variation, Diameter, Evolution) aid clinical distinction from benign lesions; dermoscopy improves accuracy.","Advanced disease may present with regional lymphadenopathy or symptoms from distant organ involvement, with or without an obvious skin lesion.","Four subtypes by descending overall frequency: superficial spreading, lentigo maligna, nodular, and acral lentiginous melanoma (dominant in Asian populations — palms/soles/nailbeds, often deeper and more often ulcerated).","Can also arise from internal mucosal surfaces (mucosal melanoma) or the eye (uveal melanoma)."],"en":"Melanoma / Skin Cancer","epidemiology":["The most important cause is UV/sun exposure.","Dysplastic nevi carry ~6% lifetime transformation risk, especially with a family history of melanoma.","Other risk factors: fair skin phenotype (red/blonde hair, blue/green/light-brown eyes, freckling), immunosuppressive medication, xeroderma pigmentosum.","In Asia, including Thailand, acral lentiginous melanoma predominates (41.8-65% of cases), unlike the sun-exposure-driven subtypes common in Western populations."],"follow_up":["Not detailed in the source."],"pathology":["Excisional biopsy with 1-2mm margins is the diagnostic standard (superior to punch biopsy for measuring Breslow thickness, which drives staging and prognosis).","IHC (e.g. Melan-A) may assist diagnosis of non-cutaneous lesions.","Molecular testing (PCR or NGS) for BRAF, KIT, and NTRK guides prognosis and treatment selection.","BRAF mutation is associated with worse baseline prognosis, mitigated by BRAF-targeted therapy.","Acral lentiginous melanoma has a lower BRAF mutation rate (~14.3%) than superficial spreading melanoma (~50%)."],"regimens":[{"approach":"Immunotherapy","evidence":"KEYNOTE-716","line":"Adjuvant, stage IIB-IIC","regimen":"Pembrolizumab x1 year"},{"approach":"Immunotherapy or targeted therapy","evidence":"CheckMate 238; KEYNOTE-054; COMBI-AD","line":"Adjuvant, stage III","regimen":"Nivolumab, pembrolizumab, or dabrafenib+trametinib (if BRAF V600-mutated) x1 year"},{"approach":"Immunotherapy","evidence":"CheckMate 238","line":"Adjuvant, stage IV (fully resected)","regimen":"Nivolumab x1 year"},{"approach":"Targeted therapy","evidence":"CoBRIM, COMBI-v, COLUMBUS","line":"Unresectable/metastatic, BRAF-mutant","regimen":"BRAF inhibitor + MEK inhibitor (vemurafenib+cobimetinib, dabrafenib+trametinib, or encorafenib+binimetinib)"},{"approach":"Immunotherapy","evidence":"CheckMate-067, RELATIVITY-047, KEYNOTE-006","line":"Unresectable/metastatic, first-line","regimen":"Nivolumab+ipilimumab, nivolumab+relatlimab, or single-agent nivolumab/pembrolizumab"},{"approach":"Cytotoxic chemotherapy","evidence":"–","line":"If immunotherapy inaccessible/ineffective","regimen":"Dacarbazine, carboplatin, or paclitaxel (response rate ~5-28%)"}],"source":{"date":"2023-11","name":"Short Notes in Clinical Oncology: A Case-based Approach — Melanoma chapter","version":"1st ed."},"stage_badges":["I","II","III","IV"],"staging":["AJCC staging system, 8th edition (2016).","Uses Breslow thickness and ulceration status, plus regional nodal and distant spread.","Stage I-II: no nodal spread.","Stage III: regional lymph node, in-transit, or microsatellite metastases.","Stage IV: distant metastasis."],"status":"ready","th":"มะเร็งผิวหนังเมลาโนมา","toxicity_monitoring":["DREAMseq observed early deaths in a subset on frontline nivolumab+ipilimumab.","Combining BRAF/MEK inhibition with immunotherapy increases toxicity without added overall survival benefit."],"treatment_overview":[{"heading":"Early-Stage / Localized Disease","items":["Surgical resection ± radiotherapy in selected cases."],"tone":"accent"},{"heading":"Adjuvant Therapy (High-Risk Resected Disease)","items":["2023 source: stage IIB-IIC — pembrolizumab x1 year; stage III — nivolumab, pembrolizumab, or dabrafenib+trametinib (if BRAF-mutant) x1 year; stage IV fully resected — nivolumab x1 year."],"tone":"amber"},{"heading":"Unresectable / Metastatic — BRAF-Mutant","items":["BRAF+MEK inhibition gives fast, high initial response.","Sequencing of targeted vs. immunotherapy is unresolved — DREAMseq favored starting with immunotherapy; SECOMBIT suggests a short BRAF-inhibitor lead-in as a comparable alternative.","Combining BRAF inhibition with immunotherapy increases toxicity and progression-free survival but not overall survival."],"tone":"rose"},{"heading":"Unresectable / Metastatic — Immunotherapy","items":["Anti-PD-1 ± anti-CTLA-4/anti-LAG-3 gives more durable long-term responses; combination outperforms monotherapy with low PD-L1, BRAF mutation, high LDH, or brain metastasis."],"tone":"rose"},{"heading":"BRAF Wild-Type Disease","items":["Consider KIT/NTRK testing or immunotherapy; conventional chemotherapy remains an option where advanced agents are inaccessible (cost is a barrier in Thailand per the source)."],"tone":"neutral"}]},"neuroendocrine-tumors":{"clinical_presentation":["Often asymptomatic, found incidentally on endoscopy, surgery, or imaging.","Mass-effect symptoms depending on location, e.g. jaundice from bile-duct compression, or gut obstruction from a small-bowel mass.","Carcinoid syndrome — flushing, diarrhea, bronchospasm, abdominal cramping, peripheral edema, palpitations — results from serotonin and substance P secretion."],"en":"Neuroendocrine Tumors (NETs)","epidemiology":["Arise from neuroendocrine cells present throughout the body; the precise cause is unknown.","Associated with inherited syndromes: Multiple Endocrine Neoplasia type 1 (MEN1), MEN type 2, von Hippel-Lindau disease, tuberous sclerosis complex, neurofibromatosis type 1, and Carney complex."],"follow_up":["Not reported in the source."],"pathology":["Classified by hormone secretion (functioning vs. non-functioning), anatomic origin (bronchopulmonary; gastroenteropancreatic NETs further split into foregut, midgut, hindgut), and WHO classification by tumor differentiation, grade, mitotic count, and Ki-67 index.","Immunohistochemistry is positive for chromogranin, synaptophysin, neuron-specific enolase, and CD56.","Radiolabeled somatostatin receptor scintigraphy is used selectively, e.g. to assess candidacy for somatostatin analogue therapy."],"regimens":[{"approach":"Somatostatin analogue","evidence":"PROMID, CLARINET trials","line":"Carcinoid symptom control","regimen":"Octreotide LAR 20-30mg IM every 4 weeks, or Lanreotide 120mg SC every 4 weeks"},{"approach":"Targeted therapy","evidence":"RADIANT trial series; sunitinib pancreatic NET trial","line":"Metastatic G1/G2, unresectable","regimen":"Everolimus 10mg/day; Sunitinib 37.5mg/day (pancreatic NET only)"},{"approach":"Peptide receptor radionuclide therapy","evidence":"For somatostatin-receptor-positive disease on imaging","line":"Metastatic G1/G2, SSTR-positive","regimen":"177Lu-dotatate PRRT"},{"approach":"Cytotoxic chemotherapy","evidence":"Relatively good response rates reported in pancreatic NET","line":"Symptomatic/bulky/progressive, especially pancreatic NET","regimen":"Temozolomide ± capecitabine; streptozocin-based; oxaliplatin-based (FOLFOX or CapeOx)"},{"approach":"Cytotoxic chemotherapy","evidence":"Standard for poorly-differentiated NEC","line":"Neuroendocrine carcinoma (NEC)","regimen":"Cisplatin or carboplatin plus etoposide; FOLFOX; FOLFIRI; temozolomide ± capecitabine"},{"approach":"Immunotherapy","evidence":"For selected biomarker-positive NEC","line":"NEC, biomarker-selected","regimen":"Nivolumab plus ipilimumab (category 2B, metastatic progressive disease); pembrolizumab (MSI-H/dMMR or TMB-H ≥10 mut/Mb)"}],"source":{"date":"2023-11","name":"Short Notes in Clinical Oncology: A Case-based Approach — Neuroendocrine Tumors chapter","version":"1st ed."},"stage_badges":["G1","G2","G3","NEC"],"staging":["Graded per the 2019 WHO classification for GI/hepatopancreatobiliary NETs and the 2015 WHO criteria for pulmonary NETs, using differentiation, grade, mitotic count, and Ki-67 index.","Well-differentiated tumors are graded G1/G2/G3; poorly-differentiated tumors are classified as Neuroendocrine Carcinoma (NEC)."],"status":"ready","th":"เนื้องอกนิวโรเอนโดครัยน์ (มะเร็งเน็ต)","toxicity_monitoring":["Not reported in the source."],"treatment_overview":[{"heading":"Well-Differentiated NET, G1/G2","items":["Somatostatin analogues for carcinoid symptom control; curative surgery is the mainstay for localized disease; surgery is also considered for metastatic disease when both primary and metastatic sites are resectable.","Unresectable/metastatic disease: observation (asymptomatic, low tumor burden), locoregional therapy (TAE/TACE or radiofrequency ablation for liver-dominant disease), or systemic therapy (somatostatin analogues, everolimus, sunitinib for pancreatic NET, peptide receptor radionuclide therapy, or cytotoxic chemotherapy for symptomatic/bulky/progressive disease)."],"tone":"accent"},{"heading":"Well-Differentiated NET, G3","items":["Favorable biology (Ki-67 <55%, slow growth, positive SSTR-based PET imaging) is treated like G1/G2 disease; unfavorable biology is treated with cytotoxic chemotherapy as for NEC."],"tone":"amber"},{"heading":"Neuroendocrine Carcinoma (NEC)","items":["Chemotherapy-based treatment, with local therapy (surgery or radiation) added when disease is non-metastatic."],"tone":"rose"}]},"ovarian-cancer":{"clinical_presentation":["Most symptomatic patients present with ascites and nonspecific GI symptoms (abdominal pain, constipation), usually once disease is already advanced.","Advanced disease can present with dyspnea, weight loss, or venous thromboembolism."],"en":"Ovarian Cancer","epidemiology":["Epithelial ovarian cancer is the most common subtype, accounting for over 90% of cases.","Risk factors include genetic predisposition, age, nulliparity, and endometriosis.","BRCA1/2 mutations (autosomal dominant) are found in up to 17% of ovarian cancer patients and also raise the risk of breast, pancreatic, and prostate cancer.","Other homologous recombination repair (HRR) pathway gene mutations (e.g. RAD51C/D, PALB2) also increase ovarian cancer risk; HRR pathway abnormalities are found in about 50% of high-grade serous ovarian cancer."],"follow_up":["Not reported in the source."],"pathology":["Workup includes the CA-125 tumor marker, CT or MRI of the abdomen and pelvis (± chest CT), and tissue pathology, which is the diagnostic gold standard and can also be used for genetic testing.","Germline BRCA1/2 testing is recommended for all epithelial ovarian cancer patients regardless of age; testing for other HRR pathway genes is also recommended."],"regimens":[{"approach":"Platinum-based chemotherapy","evidence":"Approximately 40-50% response rate","line":"First line, advanced disease","regimen":"Carboplatin plus paclitaxel"},{"approach":"Chemotherapy plus anti-angiogenic therapy","evidence":"Improves survival; response rate up to approximately 67%","line":"First line, advanced disease","regimen":"Carboplatin/paclitaxel plus bevacizumab"},{"approach":"PARP inhibitor","evidence":"SOLO-1, PRIMA trials","line":"Maintenance, BRCA1/2-mutated","regimen":"Olaparib or niraparib after complete/partial response to chemotherapy"},{"approach":"PARP inhibitor","evidence":"An option beyond chemotherapy alone","line":"Relapsed, BRCA1/2-mutated","regimen":"Olaparib or niraparib"}],"source":{"date":"2023-11","name":"Short Notes in Clinical Oncology: A Case-based Approach — Ovarian Cancer chapter","version":"1st ed."},"stage_badges":["I","II","III","IV"],"staging":["FIGO staging system."],"status":"ready","th":"มะเร็งรังไข่","toxicity_monitoring":["Not reported in the source."],"treatment_overview":[{"heading":"General Approach","items":["Chemotherapy aims to eliminate disease not amenable to surgery, given either peri-operatively or for palliation."],"tone":"neutral"},{"heading":"Advanced Disease (FIGO III-IV)","items":["Often responds well to platinum-based chemotherapy; treatment may start with chemotherapy, proceed to interval debulking surgery if response is seen, then complete at least 6 total cycles of chemotherapy.","Disease unresectable at diagnosis, or already disseminated, is treated with platinum-based chemotherapy plus bevacizumab (an angiogenesis inhibitor)."],"tone":"rose"},{"heading":"BRCA1/2-Mutated Disease","items":["A PARP inhibitor (olaparib or niraparib) is used as maintenance after complete or partial response to chemotherapy, or as treatment after relapse."],"tone":"amber"}]},"pancreatic-cancer":{"clinical_presentation":["Most present with weight loss; jaundice from biliary obstruction with steatorrhea; epigastric pain radiating to the back; nausea/vomiting; or features of pancreatitis.","New-onset diabetes after age 50, especially with accompanying abdominal pain or weight loss, should raise suspicion."],"en":"Pancreatic Cancer","epidemiology":["Risk increases with family history (genetic predisposition), smoking (modest increase), overweight/obesity, long-standing diabetes, alcohol use, and a history of chronic pancreatitis."],"follow_up":["Not reported in the source guideline."],"pathology":["Adenocarcinoma is the most common histology, confirmed via liver biopsy in metastatic disease or EUS-guided biopsy/cytology.","No general-population screening is recommended; high-risk individuals (strong family history) may be offered EUS or MRI/MRCP surveillance."],"regimens":[{"approach":"Combination chemotherapy","evidence":"–","line":"Advanced/metastatic, fit patients","regimen":"FOLFIRINOX; or gemcitabine alone or combined with oxaliplatin/capecitabine; capecitabine + oxaliplatin"}],"source":{"date":"2023-11","name":"Short Notes in Clinical Oncology: A Case-based Approach — Pancreatic Cancer chapter","version":"1st ed."},"stage_badges":["I","II","III","IV"],"staging":["AJCC TNM staging system, 8th edition (2017).","Stage I (T1-2N0, limited to pancreas) — 5-yr survival ~20%.","Stage II (T3 or N1) — 5-yr survival ~8%.","Stage III (T4, or celiac axis/SMA involvement).","Stage IV (M1, distant metastasis — the most common presentation, 53% of cases) — 5-yr survival ~2%.","Pancreatic-protocol CT or MRI (including chest and pelvis) determines resectability; EUS obtains cytology or is used when CT is not clearly diagnostic."],"status":"ready","th":"มะเร็งตับอ่อน","toxicity_monitoring":["Not reported in the source guideline."],"treatment_overview":[{"heading":"Stage I-II (Resectable)","items":["Curative-intent surgery aiming for R0 resection."],"tone":"accent"},{"heading":"Stage III-IV (Locally Advanced / Metastatic)","items":["Inoperable but localized (III) and metastatic (IV) disease: systemic therapy is the mainstay, aimed at disease control and prolonging survival rather than cure."],"tone":"rose"}]},"prostate-cancer":{"clinical_presentation":["May present with lower urinary tract symptoms (straining to void — often attributed to benign prostatic hyperplasia).","Advanced disease: bone pain (often worse at night, non-positional) from osteoblastic bone metastases.","A markedly elevated PSA (case example: 248 ng/mL) raises suspicion for metastatic disease."],"en":"Prostate Cancer","epidemiology":["Not quantified in the source. The case example is an elderly male (70y) with prior untreated benign-prostatic-hyperplasia symptoms who presented with metastatic disease."],"follow_up":["Not detailed beyond serial PSA and imaging to detect progression (illustrated by the case's PSA rise from 0.5 to 60 ng/mL after initial ADT response)."],"pathology":["Diagnosis via TRUS (transrectal ultrasound)-guided biopsy; adenocarcinoma is the predominant histology.","Graded with the Gleason scoring system (2-10), combining the two most common histologic patterns (well-differentiated=1 to anaplastic=5), e.g. 3+4=7."],"regimens":[{"approach":"ADT +/- intensification","evidence":"–","line":"mHSPC/mCSPC","regimen":"ADT (orchiectomy, GnRH agonist+antiandrogen, or GnRH antagonist) +/- apalutamide/enzalutamide/abiraterone; + docetaxel if visceral or extensive bone metastases"},{"approach":"Sequential systemic therapy by biomarker/disease pattern","evidence":"–","line":"mCRPC","regimen":"Docetaxel or cabazitaxel; abiraterone acetate; enzalutamide; sipuleucel-T; radium-223 (bone-only mets) or lutetium-177 (PSMA-positive); PARP inhibitors (olaparib, niraparib, talazoparib, rucaparib) if BRCA-mutated"}],"source":{"date":"2023-11","name":"Short Notes in Clinical Oncology: A Case-based Approach — Prostate Cancer chapter","version":"1st ed."},"stage_badges":["mHSPC/mCSPC","mCRPC"],"staging":["Metastatic workup with bone scan and CT; PSMA PET is a newer, more disease-specific modality with superior detection of locoregional and distant spread.","mHSPC/mCSPC: metastatic disease not yet treated with hormonal therapy.","mCRPC: progression (rising PSA and/or radiographic progression) despite castrate testosterone levels."],"status":"ready","th":"มะเร็งต่อมลูกหมาก","toxicity_monitoring":["Not detailed beyond bone-directed agent indications; monitor for skeletal-related events in patients with bone metastases."],"treatment_overview":[{"heading":"Metastatic Hormone-Sensitive (mHSPC/mCSPC)","items":["Androgen deprivation therapy (ADT) via orchiectomy, GnRH agonist (+antiandrogen), or GnRH antagonist; survival benefit from adding novel antiandrogens or, in visceral/extensive bone disease, docetaxel, to ADT."],"tone":"amber"},{"heading":"Bone-Directed Therapy","items":["Bone-antiresorptive agents reduce skeletal-related events; palliative radiotherapy reduces bone pain; surgery relieves pain and stabilizes or prevents pathological fractures."],"tone":"neutral"},{"heading":"Metastatic Castration-Resistant (mCRPC)","items":["Sequential options include chemotherapy, androgen-synthesis/receptor inhibition, immunotherapy, radionuclide therapy, and PARP inhibitors (if BRCA-mutated)."],"tone":"rose"}]},"sarcoma":{"clinical_presentation":["Painless, enlarging soft tissue mass at the site of origin.","Most common sites: extremities (60%), trunk (19%), retroperitoneum (15%), head and neck (9%).","Lymph node spread is uncommon; metastatic disease predominantly involves the lungs."],"en":"Soft Tissue Sarcoma","epidemiology":["Sarcomas (connective-tissue malignancies) comprise soft tissue sarcoma (>50 WHO-recognized subtypes) and bone sarcoma; soft tissue sarcoma is ~4x more common than bone sarcoma in adults.","Overall incidence ~1% of adult cancers and ~15% of pediatric cancers.","Hereditary syndromes: Li-Fraumeni (rhabdomyosarcoma), hereditary retinoblastoma (leiomyosarcoma), neurofibromatosis type 1 (malignant peripheral nerve sheath tumor).","Other risk factors: vinyl chloride exposure (hepatic angiosarcoma), prior radiotherapy, chronic lymphedema (angiosarcoma), human herpesvirus-8 infection (Kaposi sarcoma)."],"follow_up":["Not detailed beyond routine chest imaging surveillance (implied by high rate of pulmonary metastasis) and palliative care integration throughout."],"pathology":["Named by tissue of origin (e.g. leiomyosarcoma — smooth muscle; rhabdomyosarcoma — skeletal muscle; liposarcoma — adipose tissue).","Diagnosis requires tissue for histopathology, with IHC or genetic testing for subtyping; core needle biopsy by a sarcoma-experienced surgeon is recommended (biopsy tract can affect surgical planning).","Fine-needle aspiration is discouraged — insufficient sampling for diagnosis.","Contrast-enhanced MRI or CT assesses size and vascular/neural involvement for surgical planning; chest imaging assesses for pulmonary metastasis."],"regimens":[{"approach":"Combination chemotherapy","evidence":"Judson et al.","line":"Metastatic, first-line, high symptom burden","regimen":"Doxorubicin + ifosfamide (higher response rate than doxorubicin alone, no proven survival benefit)"},{"approach":"Chemotherapy/targeted therapy by histologic subtype","evidence":"PALETTE (pazopanib)","line":"Metastatic, subtype-directed","regimen":"Ifosfamide (synovial sarcoma, myxoid/round-cell liposarcoma); gemcitabine+docetaxel (leiomyosarcoma, especially uterine; undifferentiated pleomorph (function(){

  var GROUPS = [
    { key:"common", label:"Common cancer", items:[

    { key:"gi", label:"GI & GU cancer", items:[

      {slug:"gist", th:"เนื้องอก GIST", en:"GIST"},

    ]},
    { key:"gyn", label:"Gynecologic cancer", items:[

    ]},
    { key:"uncommon", label:"Uncommon cancer", items:[

      {slug:"cns-tumor", th:"เนื้องอกสมอง", en:"CNS tumor"},
      {slug:"germ-cell-tumor", th:"มะเร็งเซลล์สืบพันธุ์", en:"Germ cell tumor"},

      {slug:"sarcoma", th:"ซาร์โคมา", en:"Sarcoma"},
      {slug:"neuroendocrine-tumors", th:"เนื้องอกนิวโรเอนโดครัยน์ (มะเร็งเน็ต)", en:"Neuroendocrine tumors"},
      {slug:"bone-tumor", th:"มะเร็งกระดูก", en:"Bone tumor"}
    ]},
    { key:"supportive", label:"Supportive care", items:[
      {slug:"adr-management", th:"การจัดการอาการไม่พึงประสงค์จากยาต้านมะเร็ง", en:"Adverse drug reactions management"}
    ]}
  ];

  var TEMPLATE_SLUG = "template-example";

  var ICONS = {
    epi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg>',
    clin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6l-3 4a5 5 0 0 0 10 0l-3-4V2"/><circle cx="19" cy="15" r="2.5"/></svg>',
    path: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h8"/><path d="M3 22h12"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a5 5 0 0 1 5-5V4a2 2 0 0 0-2-2H8"/></svg>',
    stage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
    tx: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a5 5 0 1 1 7-7l7 7a5 5 0 1 1-7 7Z"/><path d="m8.5 8.5 7 7"/></svg>',
    src: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>'
  };

  var state = { data: DATA, active: null };

  function allItems(){
    var out = [];
    GROUPS.forEach(function(g){ g.items.forEach(function(it){ out.push(it); }); });
    return out;
  }

  function statusOf(slug){
    var d = state.data[slug];
    return d ? d.status : "pending";
  }

  function renderRail(filter){
    var wrap = document.getElementById("groups");
    wrap.innerHTML = "";
    var f = (filter||"").trim().toLowerCase();

    // template pinned first when it matches / no filter
    var tplMatches = !f || "ตัวอย่าง template example".indexOf(f) !== -1;
    if (tplMatches){
      var lbl = document.createElement("div");
      lbl.className = "group-label";
      lbl.textContent = "Reference";
      wrap.appendChild(lbl);
      wrap.appendChild(itemButton({slug:TEMPLATE_SLUG, th:"ตัวอย่างโครงสร้าง", en:"Template"}, "template"));
    }

    GROUPS.forEach(function(g){
      var matched = g.items.filter(function(it){
        if(!f) return true;
        return (it.th+" "+it.en).toLowerCase().indexOf(f) !== -1;
      });
      if(!matched.length) return;
      var lbl2 = document.createElement("div");
      lbl2.className = "group-label";
      lbl2.textContent = g.label;
      wrap.appendChild(lbl2);
      matched.forEach(function(it){
        wrap.appendChild(itemButton(it, statusOf(it.slug)));
      });
    });

    var ready = allItems().filter(function(it){ return statusOf(it.slug)==="ready"; }).length;
    document.getElementById("ready-count").textContent = ready;
    document.getElementById("total-count").textContent = allItems().length;
  }

  function itemButton(it, status){
    var btn = document.createElement("button");
    btn.className = "item" + (state.active===it.slug ? " active" : "");
    btn.innerHTML =
      '<span class="dot '+status+'"></span>' +
      '<span class="name">'+it.en+'<span class="sub">'+it.th+'</span></span>';
    btn.addEventListener("click", function(){
      state.active = it.slug;
      renderRail(document.getElementById("search").value);
      renderMain(it.slug);
      if (window.innerWidth <= 860) document.getElementById("main").scrollIntoView({behavior:"smooth"});
    });
    return btn;
  }

  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function renderMain(slug){
    var main = document.getElementById("main");
    if(!slug){
      main.innerHTML =
        '<div class="empty">' +
          '<div class="eyebrow">Onco Reference</div>' +
          '<h2>เลือกชนิดมะเร็งทางซ้ายเพื่อดูสรุป</h2>' +
          '<p>หน้านี้เป็นไฟล์ static เก็บสรุปทั้งหมด ณ วันที่ export ไว้ในตัวไฟล์เอง — เปิดได้จากทุกเบราว์เซอร์โดยไม่ต้องล็อกอิน Claude</p>' +
          '<div class="howto">' +
            '<b>เกี่ยวกับไฟล์นี้</b>' +
            '<ol>' +
              '<li>ข้อมูลทั้งหมด (23  ชนิดมะเร็ง) ถูกฝังไว้ในไฟล์นี้แล้ว ไม่ต้องต่อเน็ตก็เปิดดูได้</li>' +
              '<li>อัปเดตครั้งล่าสุด: <b>2026-09-05</b> — ถ้าอยากได้ฉบับล่าสุดหลังแก้ไขบน Claude ให้ export ไฟล์นี้ใหม่</li>' +
              '<li>เพิ่ม/แก้สรุปใหม่ยังต้องทำผ่าน Onco Reference บน Claude แล้วค่อย export ไฟล์ static นี้ใหม่อีกครั้ง</li>' +
            '</ol>' +
          '</div>' +
        '</div>';
      return;
    }

    var d = state.data[slug] || {status:"pending"};
    var meta = findItem(slug) || {th:d.th, en:d.en};

    if (d.status === "pending" || !d.status){
      main.innerHTML =
        '<div class="detail-head">' +
          '<div><h2>'+escapeHtml(meta.en)+'</h2><div class="sub">'+escapeHtml(meta.th)+'</div></div>' +
          '<span class="badge pending">รอข้อมูล</span>' +
        '</div>' +
        '<div class="pending-note">ยังไม่มีสรุปสำหรับชนิดนี้ — แนบ guideline หรือ journal ของ '+escapeHtml(meta.th)+' ในแชท แล้วขอให้สรุป จะมาโผล่ตรงนี้ให้อัตโนมัติ</div>';
      return;
    }

    var isTemplate = d.status === "template";
    var badgeHtml = isTemplate
      ? '<span class="badge template">ตัวอย่าง (Template)</span>'
      : '<span class="badge ready">พร้อมใช้</span>';

    var html = '<div class="detail-head">' +
        '<div><h2>'+escapeHtml(meta.en || d.en)+'</h2><div class="sub">'+escapeHtml(meta.th || d.th)+'</div></div>' +
        badgeHtml +
      '</div>';

    if (isTemplate){
      html += '<div class="template-flag">เนื้อหาด้านล่างเป็นตัวอย่างโครงสร้างเท่านั้น ไม่ใช่ข้อมูลทางคลินิกจริง — ใช้เพื่อดูหน้าตาผลลัพธ์ที่จะได้เมื่อสรุปจริงถูกเพิ่มเข้ามา</div>';
    }

    var stageBadges = (d.stage_badges||[]).length
      ? '<div class="chip-row">'+d.stage_badges.map(function(s){ return '<span class="chip on">'+escapeHtml(s)+'</span>'; }).join("")+'</div>'
      : '';

    html += block(ICONS.epi, "Epidemiology", bullets(d.epidemiology));
    html += block(ICONS.clin, "Clinical Presentation", bullets(d.clinical_presentation));
    html += block(ICONS.path, "Pathology", bullets(d.pathology));
    html += block(ICONS.stage, "Staging", stageBadges + bullets(d.staging));

    var txRows = (d.regimens||[]).map(function(t){
      return '<div class="tx-row">' +
        '<div class="line">'+escapeHtml(t.line)+'</div>' +
        '<div><div>'+escapeHtml(t.approach)+'</div>' +
        '<div class="regimen">'+escapeHtml(t.regimen)+'</div>' +
        '<div class="evidence">Evidence: <span class="mono">'+escapeHtml(t.evidence)+'</span></div></div>' +
      '</div>';
    }).join("");
    var txSub = function(label, arr){
      return (arr && arr.length) ? '<div style="margin-top:16px;"><div style="font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">'+label+'</div>'+bullets(arr)+'</div>' : '';
    };
    // treatment_overview: preferred shape is an array of {heading, items, tone} sub-sections,
    // rendered as a visual stage pathway — one colored card per clinical setting, connected
    // top-to-bottom like a timeline, so the reader sees the whole disease course at a glance.
    // tone (accent=early/localized, amber=locally advanced/adjuvant, rose=metastatic/recurrent,
    // neutral=supportive/cross-cutting) is set per entry; defaults to neutral if absent.
    // Falls back to a flat bullet list for legacy content that is still a plain string array.
    var txIntro = "";
    var tov = d.treatment_overview;
    if (tov && tov.length){
      if (typeof tov[0] === "object" && tov[0] !== null){
        var stageItems = tov.map(function(sec){
          var tone = ["accent","amber","rose","neutral"].indexOf(sec.tone) !== -1 ? sec.tone : "neutral";
          return '<div class="stage-item">' +
              '<div class="stage-marker"><span class="stage-dot tone-'+tone+'"></span><span class="stage-line"></span></div>' +
              '<div class="stage-body"><div class="stage-card tone-'+tone+'"><h4>'+escapeHtml(sec.heading)+'</h4>'+bullets(sec.items)+'</div></div>' +
            '</div>';
        }).join("");
        txIntro = '<div class="stage-path">'+stageItems+'</div>';
      } else {
        txIntro = '<div style="margin-bottom:14px;">'+bullets(tov)+'</div>';
      }
    }
    html += block(ICONS.tx, "Treatment", txIntro + '<div class="tx-table">'+txRows+'</div>' +
      txSub("Toxicity &amp; Monitoring", d.toxicity_monitoring) +
      txSub("Follow-up / Surveillance", d.follow_up)
    );

    var src = d.source || {};
    html += block(ICONS.src, "Source", '<div class="source-card"><span class="name">'+escapeHtml(src.name)+'</span><span class="meta mono">'+escapeHtml(src.version)+' · '+escapeHtml(src.date)+'</span></div>');

    main.innerHTML = html;
  }

  // Accepts either an array of bullet strings (preferred) or a legacy
  // plain string (rendered as a single bullet) — so older content still renders.
  function bullets(val){
    var arr = Array.isArray(val) ? val : (val ? [val] : []);
    if (!arr.length) return '<p style="color:var(--ink-soft);">Not reported in the source.</p>';
    return '<ul class="bul">'+arr.map(function(s){ return '<li>'+escapeHtml(s)+'</li>'; }).join("")+'</ul>';
  }

  function block(icon, title, bodyHtml){
    return '<section class="block"><h3>'+icon+'<span>'+title+'</span></h3><div class="body">'+bodyHtml+'</div></section>';
  }

  function findItem(slug){
    for (var i=0;i<GROUPS.length;i++){
      for (var j=0;j<GROUPS[i].items.length;j++){
        if (GROUPS[i].items[j].slug === slug) return GROUPS[i].items[j];
      }
    }
    if (slug === TEMPLATE_SLUG) return {th:"ตัวอย่างโครงสร้าง", en:"Template"};
    return null;
  }

  document.getElementById("search").addEventListener("input", function(e){
    renderRail(e.target.value);
  });

  renderRail("");
  renderMain(null);


})();
</script>
